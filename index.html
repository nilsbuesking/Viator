<body>
<div id="app"></div>
<script src="app.js" data-content="content/"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    // When a new version has been downloaded and takes over, the app decides when to reload (Viator.updateReady),
    // so that an exercise or test in progress is not lost.
    var hadController = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController || reloaded) { hadController = true; return; }
      reloaded = true;
      if (window.Viator && window.Viator.updateReady) window.Viator.updateReady(); else location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(function (reg) { reg.update(); }).catch(function () {});
  }
</script>
</body>
